{% comment %}
  Componente: Opciones de selección  → Kit UI 9.2 (checkbox, radio, interruptor).
  Accesibilidad: <label> asociado, foco visible, estado disabled real.
  Parámetros: type (checkbox|radio|switch), label, name, id, checked, disabled
{% endcomment %}
{% if type == 'switch' %}
  <label class="inline-flex cursor-pointer items-center gap-3 {% if disabled %}cursor-not-allowed opacity-50{% endif %}">
    <input type="checkbox" role="switch" class="peer sr-only" name="{{ name }}" id="{{ id }}" {% if checked %}checked{% endif %} {% if disabled %}disabled{% endif %}>
    <span class="relative h-6 w-11 rounded-full bg-gray-300 transition after:absolute after:left-0.5 after:top-0.5 after:h-5 after:w-5 after:rounded-full after:bg-white after:transition peer-checked:bg-govco-cobalt peer-checked:after:translate-x-5 peer-focus-visible:ring-2 peer-focus-visible:ring-govco-cobalt peer-focus-visible:ring-offset-2"></span>
    <span class="text-sm text-cgn-negro">{{ label }}</span>
  </label>
{% else %}
  <label class="inline-flex cursor-pointer items-center gap-2 text-sm text-cgn-negro {% if disabled %}cursor-not-allowed opacity-50{% endif %}">
    <input type="{{ type|default:'checkbox' }}" name="{{ name }}" id="{{ id }}" {% if checked %}checked{% endif %} {% if disabled %}disabled{% endif %}
           class="h-4 w-4 border-gray-300 accent-govco-cobalt focus-visible:ring-2 focus-visible:ring-govco-cobalt {% if type == 'radio' %}rounded-full{% else %}rounded{% endif %}">
    {{ label }}
  </label>
{% endif %}
