{% comment %}
  Componente: Acordeón (secciones plegables)  → Kit UI 9.2 (Acordeón).
  No se abre solo: el usuario lo abre con Enter/Espacio/clic. aria-expanded y
  aria-controls; jerarquía de encabezados con <button> dentro de la cabecera.
  Parámetros: items (lista de {title, body}), id (prefijo único), numbered (bool)
{% endcomment %}
<div class="divide-y divide-gray-200 overflow-hidden rounded-xl border border-gray-200" data-accordion>
  {% for it in items %}
    <div>
      <h3>
        <button type="button" data-accordion-btn aria-expanded="false" aria-controls="{{ id }}-{{ forloop.counter }}"
                class="flex w-full items-center justify-between gap-3 bg-white px-5 py-4 text-left hover:bg-govco-solitude focus:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-govco-cobalt">
          <span class="flex items-center gap-3 font-titulo text-sm font-bold text-cgn-negro">
            {% if numbered %}<span class="inline-flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-govco-cobalt text-xs text-white">{{ forloop.counter }}</span>{% endif %}
            {{ it.title }}
          </span>
          <svg class="h-5 w-5 shrink-0 text-govco-cobalt transition-transform" data-accordion-chevron fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
        </button>
      </h3>
      <div id="{{ id }}-{{ forloop.counter }}" data-accordion-panel class="hidden bg-govco-smoke px-5 py-4 text-sm leading-relaxed text-cgn-grisos">
        {{ it.body }}
      </div>
    </div>
  {% endfor %}
</div>

<script>
(function(){
  if (window.__accordionInit) return; window.__accordionInit = true;
  document.addEventListener('click', function(e){
    var btn = e.target.closest('[data-accordion-btn]'); if(!btn) return;
    var panel = document.getElementById(btn.getAttribute('aria-controls'));
    var chev = btn.querySelector('[data-accordion-chevron]');
    var open = panel.classList.toggle('hidden') === false;
    btn.setAttribute('aria-expanded', open);
    if (chev) chev.style.transform = open ? 'rotate(180deg)' : '';
  });
})();
</script>
